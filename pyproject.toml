[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimalabs-cli"
version = "0.3.0"
description = "AWS-CLI-shaped command line for AIMA Labs — drive voice/WhatsApp campaigns from humans, CI, or AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AIMA Labs" }]
keywords = ["aima", "cli", "voice", "campaigns", "agents", "outbound"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
    "questionary>=2.1.1",
]

[project.urls]
Homepage = "https://aimalabs.io"
Repository = "https://github.com/aimalabs/aimalabs-cli"
Issues = "https://github.com/aimalabs/aimalabs-cli/issues"

[project.scripts]
aima = "aima.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aima"]

[tool.hatch.version]
path = "src/aima/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: defining typer.Option(...) in defaults is the intended Typer idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
