name: Release

# Publishes to PyPI on a version tag (e.g. v0.1.0) using Trusted Publishing
# (OIDC) — no API token needed once the publisher is configured on PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aimalabs-cli
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: publish
    runs-on: macos-latest
    environment: pypi

    steps:
      - name: Checkout CLI repo
        uses: actions/checkout@v4

      - name: Install jq
        run: brew install jq

      - name: Run Tap Update Script
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: ./scripts/update-tap.sh
